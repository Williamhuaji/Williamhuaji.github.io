<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>William的网页服务器</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .bg-blob {
            filter: blur(80px);
            opacity: 0.4;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card-animate {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">
    <div class="bg-blob absolute top-20 -left-20 w-72 h-72 rounded-full bg-blue-300 z-0"></div>
    <div class="bg-blob absolute bottom-20 -right-20 w-80 h-80 rounded-full bg-purple-300 z-0"></div>

    <div class="relative z-10 w-full max-w-lg bg-white/70 backdrop-blur-md rounded-2xl shadow-xl p-8 md:p-10 card-animate">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white mb-4 shadow-lg shadow-blue-200">
                <i class="fa-solid fa-server text-xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-2">
                William的网页服务器
            </h1>
            <p class="text-gray-600">选择下方站点，立即开始访问</p>
        </div>

        <div class="space-y-4">
            <!-- 个人网站 我要崩溃了 -->
            <div class="group flex items-center justify-between p-4 bg-gray-50/80 rounded-xl hover:bg-blue-50/80 hover:shadow-md transition-all duration-300 border border-transparent hover:border-blue-200">
                <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 flex items-center justify-center rounded-lg bg-blue-100 text-blue-600 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-800">William的个人网站</p>
                        <p class="text-sm text-gray-500">个人主页啥都没有</p>
                    </div>
                </div>
                <a href="GR/index.html" target="_blank"
                    class="flex items-center gap-1 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-lg transition-all duration-300 group-hover:translate-x-0.5">
                    访问
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>

            <!-- TSM服务器官网 -->
            <div class="group flex items-center justify-between p-4 bg-gray-50/80 rounded-xl hover:bg-emerald-50/80 hover:shadow-md transition-all duration-300 border border-transparent hover:border-emerald-200">
                <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 flex items-center justify-center rounded-lg bg-emerald-100 text-emerald-600 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-gamepad"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-800">TSM服务器官网</p>
                        <p class="text-sm text-gray-500">TSM 4周目开放！</p>
                    </div>
                </div>
                <a href="TSM/index.html" target="_blank"
                    class="flex items-center gap-1 px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-medium rounded-lg transition-all duration-300 group-hover:translate-x-0.5">
                    访问
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>

            <div class="group flex items-center justify-between p-4 bg-gray-50/80 rounded-xl hover:bg-amber-50/80 hover:shadow-md transition-all duration-300 border border-transparent hover:border-amber-200">
                <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 flex items-center justify-center rounded-lg bg-amber-100 text-amber-600 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-800">AdinTS的个人网站</p>
                        <p class="text-sm text-gray-500">神秘阿丁🤔</p>
                    </div>
                </div>
                <a href="http://adin.ts1.top/" target="_blank"
                    class="flex items-center gap-1 px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium rounded-lg transition-all duration-300 group-hover:translate-x-0.5">
                    访问
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </a>
            </div>

            <div class="group flex items-center justify-between p-4 bg-gray-50/80 rounded-xl hover:bg-violet-50/80 hover:shadow-md transition-all duration-300 border border-transparent hover:border-violet-200">
                <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 flex items-center justify-center rounded-lg bg-violet-100 text-violet-600 group-hover:scale-110 transition-transform duration-300">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-gray-800">网站更新日志</p>
                        <p class="text-sm text-gray-500">查看网页更新记录</p>
                    </div>
                </div>
                <a href="GX/index.html" target="_blank"
                    class="flex items-center gap-1 px-4 py-2 bg-violet-500 hover:bg-violet-600 text-white text-sm font-medium rounded-lg transition-all duration-300 group-hover:translate-x-0.5">
                    查看
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-200/60 text-center">
            <p class="text-xs text-gray-500">© 2026 William电脑强力驱动</p>
        </div>
    </div>
</body>

</html>
